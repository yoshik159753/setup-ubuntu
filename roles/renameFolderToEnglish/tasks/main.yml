- name: Install xdg-user-dirs
  become: true
  ansible.builtin.apt:
    name: xdg-user-dirs
    state: present

- name: Create directories
  ansible.builtin.shell: LANG=C xdg-user-dirs-update --force
  args:
    creates: "{{ ansible_env.HOME }}/Documents"
  notify:
    - Please run manually
    - Please delete the folder you do not need
    - Reboot

- name: Update bookmark
  ansible.builtin.template:
    src: bookmarks.j2
    dest: ~/.config/gtk-3.0/bookmarks
    backup: true
  notify:
    - Warning for bookmark

