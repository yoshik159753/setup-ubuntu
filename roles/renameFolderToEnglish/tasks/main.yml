- name: Install xdg-user-dirs
  become: true
  tags: renamefoldertoenglish
  ansible.builtin.apt:
    name: xdg-user-dirs
    state: present

- name: Create directories
  tags: renamefoldertoenglish
  ansible.builtin.shell: LANG=C xdg-user-dirs-update --force
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/Documents"
  notify:
    - Please run manually
    - Please delete the folder you do not need
    - Reboot

- name: Update bookmark
  tags: renamefoldertoenglish
  ansible.builtin.template:
    src: bookmarks.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/gtk-3.0/bookmarks"
    backup: true
  notify:
    - Warning for bookmark

