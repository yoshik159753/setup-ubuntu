- name: Add HashiCorp GPG key
  become: true
  tags: vagrant
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: "{{ KEYRINGS_PATH }}/hashicorp.asc"

- name: Add HashiCorp repository
  become: true
  tags: vagrant
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ KEYRINGS_PATH }}/hashicorp.asc] https://apt.releases.hashicorp.com {{ ansible_facts['lsb']['codename'] }} main"
    filename: hashicorp
    state: present
    update_cache: true

- name: Install Vagrant
  become: true
  tags: vagrant
  ansible.builtin.apt:
    name: vagrant
    state: latest
  notify: Notify download box

# ref. https://developer.hashicorp.com/vagrant/install
