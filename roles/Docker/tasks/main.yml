- name: Install packages
  become: yes
  apt:
    name: ['apt-transport-https', 'ca-certificates', 'curl', 'software-properties-common']
    state: present

- name: Add Docker’s official GPG key.
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: "{{ KEYRINGS_PATH }}/docker.asc"

- name: Use the following command to set up the stable repository.
  become: true
  apt_repository:
    repo: "deb [arch=amd64 signed-by={{ KEYRINGS_PATH }}/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
    filename: docker
    state: present
    update_cache: yes

- name: Install the latest version of Docker CE.
  become: yes
  apt:
    name:
      - docker-ce
      - docker-compose-plugin
    state: latest
    update_cache: yes
  notify:
    - Verify docker is installed correctly

- name: Add docker group
  become: yes
  group:
    name: docker
    state: present
  notify:
    - Restart docker service

- name: Apply docker group
  become: yes
  user:
    name: "{{ ansible_env.USER }}"
    groups: docker
    append: yes
    state: present
  notify:
    - Notify Re-login

# ref. https://docs.docker.com/install/linux/docker-ce/ubuntu/#install-docker-ce
# ref. https://docs.docker.com/compose/install/linux/
