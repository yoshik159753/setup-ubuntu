- name: Install required packages
  become: true
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
    state: present

- name: Add Docker’s official GPG key
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: "{{ KEYRINGS_PATH }}/docker.asc"

- name: Add the Docker stable repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by={{ KEYRINGS_PATH }}/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
    filename: docker
    state: present
    update_cache: true

- name: Install Docker CE and Compose plugin
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-compose-plugin
    state: latest
    update_cache: true
  notify:
    - Verify docker is installed correctly

- name: Add docker group
  become: true
  ansible.builtin.group:
    name: docker
    state: present
  notify:
    - Restart docker service

- name: Apply docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_env.USER }}"
    groups: docker
    append: true
    state: present
  notify:
    - Notify Re-login

# ref. https://docs.docker.com/install/linux/docker-ce/ubuntu/#install-docker-ce
# ref. https://docs.docker.com/compose/install/linux/
